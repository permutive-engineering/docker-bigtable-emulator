name: Build

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the image version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          tags: bigtable-emulator:test

      - name: Smoke test
        run: |
          docker run -d --rm --name bigtable -p 8086:8086 -e BIGTABLE_SCHEMA="users:a#b,events:c" bigtable-emulator:test

          for _ in $(seq 1 40); do nc -z localhost 8086 && break; sleep 0.25; done

          docker logs bigtable 2>&1 | grep -q "running on .* with 2 tables"

          docker stop -t 0 bigtable

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/permutive-engineering/bigtable-emulator:${{ env.VERSION }}
            ghcr.io/permutive-engineering/bigtable-emulator:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Cloud Bigtable emulator that creates its tables before it accepts connections, for local and CI testing
            org.opencontainers.image.licenses=Apache-2.0
